schema: spec-driven

context: |
  All OpenSpec artifacts must be written in English.
  Read AGENTS.md, CONTEXT.md, and CONVENTIONS.md before creating artifacts.
  Frontend visual changes must follow frontend/DESIGN.md.
  The application is a modular monolith. Backend business code belongs to capability packages, not global technical-layer packages.
  Preserve existing public behavior unless a delta spec explicitly changes it.
  Use the narrowest relevant verification command for each task. Final verification uses `npm run check`.

rules:
  proposal:
    - "Use the schema headings; add a concise ## Non-Goals section after ## What Changes."
    - "In ## Why, state the user or business problem and one observable success outcome."
    - "List only user-observable contracts as capabilities; implementation-only work is not a capability."
    - "Keep the change small and reversible. In ## Impact, state compatibility, migration, security, and documentation effects when applicable."
  specs:
    - "Every ADDED or MODIFIED requirement uses one normative MUST sentence followed by observable scenarios."
    - "Every scenario uses **GIVEN**, **WHEN**, and **THEN** in that order; use **AND** only to continue the preceding clause."
    - "Cover the primary flow and material boundary, rejection, and error behavior; avoid combinatorial variants."
    - "For API errors, define HTTP status, stable code, and consumer-safe message; never expose internal causes."
  design:
    - "Record only material technical decisions; for each, state the decision, rationale, rejected alternative, and consequence."
    - "Add ## Test Strategy after ## Risks / Trade-offs; state behavior, test level, and verification command."
    - "Include Mermaid only when it clarifies a non-trivial seam, dependency, or data flow; accompany it with concise prose."
    - "State security and privacy impact when auth, secrets, user input, or personal data are involved."
  tasks:
    - "Reference the requirement and scenario delivered by each behavior-bearing task."
    - "Use one checkbox per behavior or technical increment. For new logic, perform RED -> GREEN within that task."
    - "Add a separate REFACTOR task only when an identified smell requires structural work under green tests."
    - "State the narrowest verification command and expected observable result for each task."
    - "For visual-only changes, use lint, build, design lint, and a browser smoke check instead of markup or CSS-structure assertions."
    - "End with `npm run check`; complete a task only after reading its command output."
