schema: spec-driven

context: |
  Documentation and all OpenSpec artifacts must be written in English.
  Stack: Java 21, Spring Boot 4.1.0, Spring MVC, Spring Security, Spring JDBC, Spring Modulith 2.1.0, springdoc-openapi 3.0.3, React 19, TypeScript 6, Vite 8, Tailwind CSS 4, shadcn/ui, and MariaDB 12.3.
  Toolchain: Maven Wrapper 3.9.16 for the backend; Node.js 22.23.1 and npm 10.9.8 for the root and frontend.
  Verification: `cd backend && ./mvnw test` for backend tests, `cd backend && ./mvnw verify` for the backend build, `cd frontend && npm run lint` for frontend linting, `cd frontend && npm run build` for frontend type checking and build, and `npm run openspec -- doctor` for OpenSpec.
  Unit-test domain and application logic. Do not assert rendered markup, CSS classes, or component structure for visual-only changes. Verify TSX-only and CSS-only changes with frontend lint, build, design lint, and a browser smoke check. Keep integration tests only for critical framework contracts that unit tests cannot prove, especially security. Preserve existing public behavior unless a spec changes it.

rules:
  proposal:
    - "Use the schema headings; add a concise ## Non-Goals section after ## What Changes."
    - "In ## Why, state the user or business problem and one observable success outcome."
    - "In ## Capabilities, name only new or modified spec capabilities; do not describe implementation."
    - "Keep scope small enough for one reversible change. In ## Impact, state compatibility, migration, and documentation effects when applicable."
  specs:
    - "For every ADDED or MODIFIED Requirement, use this order: one normative MUST sentence, **Priority:** P0/P1/P2, **Rationale:** one sentence, then scenarios."
    - "Use P0 for security, data-loss, compliance, or unusable-flow risk; P1 for release-critical behavior; P2 for deferrable behavior."
    - "Every scenario uses **GIVEN**, **WHEN**, and **THEN** in that order; use **AND** only to continue the preceding clause."
    - "Cover the primary flow and each relevant boundary or rejected behavior with observable outcomes."
    - "For API errors, define HTTP status, stable code, and consumer-safe message; never expose internal causes."
  design:
    - "Keep the schema headings and add ## Test Strategy after ## Risks / Trade-offs; state behavior, test level, and verification command."
    - "Include one Mermaid diagram only when it clarifies a non-trivial boundary, data flow, or integration; accompany it with concise prose."
    - "For every material decision, state decision, rationale, alternatives considered, and consequence."
    - "Note security or privacy impact when auth, secrets, user input, or personal data are involved."
  tasks:
    - "Reference the capability and scenario each task delivers."
    - "For each logic-bearing behavior, order tasks as RED (write a failing unit test and command expected to fail), GREEN (minimum implementation and same command expected to pass), then REFACTOR only when a real smell exists."
    - "For template-only or CSS-only changes, use the build, design lint, and a browser smoke check instead of assertions against rendered HTML, CSS classes, or fragment structure."
    - "Include the exact verification command and expected result in every task; add a final full-suite verification task."
    - "Mark a task complete only after its expected command output was read."
